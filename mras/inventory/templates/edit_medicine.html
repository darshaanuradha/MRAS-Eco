{% extends "base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Edit Medicine: {{ medicine.name }}</h1>
    
    <div class="bg-white p-6 border border-slate-200 rounded-lg shadow-sm">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                {% for field in form %}
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            
            <div class="flex justify-end gap-4 mt-6">
                <a href="{% url 'inventory' %}" class="px-4 py-2 text-slate-600 hover:text-slate-900">Cancel</a>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-medium">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
