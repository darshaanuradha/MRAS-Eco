{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white border border-slate-200 rounded-lg">
    <h2 class="text-xl font-bold mb-4">Delete Medicine</h2>
    <p class="mb-6">Are you sure you want to delete <strong>{{ medicine.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex gap-4">
            <a href="{% url 'inventory' %}" class="px-4 py-2 bg-slate-200 rounded">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded">Confirm Delete</button>
        </div>
    </form>
</div>
{% endblock %}
