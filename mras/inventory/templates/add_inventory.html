{% extends "base.html" %}

{% block title %}Add Inventory Batch{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-slate-900 mb-6">Add Stock Batch</h1>
    
    <div class="bg-white p-6 border border-slate-200 rounded-lg shadow-sm">
        <form method="post">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                {% for field in form %}
                <div class="mb-4 {% if field.name == 'medicine' %}col-span-2{% endif %}">
                    <label class="block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            
            <div class="flex justify-end gap-4 mt-6">
                <a href="{% url 'inventory' %}" class="px-4 py-2 text-slate-600 hover:text-slate-900 font-medium">Cancel</a>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg font-medium">
                    Save Batch
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
