{% extends "base.html" %}

{% block title %}Add New Medicine{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="page-header">
        <div class="page-header-info">
            <h1 class="page-title">Add New Medicine</h1>
        </div>
    </div>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-row-2 grid grid-cols-2 gap-4">
                    {% for field in form %}
                    <div class="form-group mb-4">
                        <label class="form-label block text-sm font-medium text-slate-700 mb-1">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="flex justify-end gap-4 mt-6">
                    <a href="{% url 'inventory' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        Add Medicine
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
