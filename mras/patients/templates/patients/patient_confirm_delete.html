{% extends 'base.html' %}

{% block title %}Delete Patient - MRAS Eco{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white shadow rounded-lg p-6 border border-slate-100 mt-10">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4">
            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Delete Patient</h1>
        <p class="text-sm text-slate-500 mt-2">Are you sure you want to delete the patient <strong>{{ patient.name }}</strong>? This action cannot be undone.</p>
    </div>

    <form method="POST" class="flex justify-center gap-4 mt-8 pt-4 border-t border-slate-100">
        {% csrf_token %}
        <a href="{% url 'patient_detail' patient.pk %}" class="px-6 py-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 font-medium">Cancel</a>
        <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-medium">Yes, Delete</button>
    </form>
</div>
{% endblock %}
