{% extends 'base.html' %}

{% block title %}Delete Patient - MRAS Eco{% endblock %}

{% block content %}
<div class="confirm-dialog flex justify-center mt-10">
    <div class="card max-w-xl w-full bg-white shadow-lg rounded-xl border border-slate-100">
        <div class="card-body p-8 text-center">
            <div class="confirm-icon danger mx-auto mb-5 flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h1 class="confirm-title text-2xl font-bold text-slate-900 mb-2">Delete Patient</h1>
            <p class="confirm-text text-slate-600 mb-8">Are you sure you want to delete the patient <strong class="text-slate-900">{{ patient.name }}</strong>? This action cannot be undone.</p>
            
            <form method="POST" class="confirm-actions flex justify-center gap-4">
                {% csrf_token %}
                <a href="{% url 'patient_detail' patient.pk %}" class="btn btn-secondary px-6 py-2.5">Cancel</a>
                <button type="submit" class="btn btn-danger px-6 py-2.5">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
